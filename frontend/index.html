<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseIQ | Contract Risk Intelligence</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="theme-dark">
    <!-- Header -->
    <header class="app-header glass-card">
        <div class="brand">
            <div class="logo"></div>
            <h1>ClauseIQ</h1>
        </div>
        
        <div class="pipeline-progress" id="pipeline-progress">
            <!-- Progress steps will be injected here -->
        </div>

        <div class="header-actions">
            <span class="mode-indicator" id="mode-indicator">Mode: Auto</span>
            <label class="btn btn-primary">
                Upload Contract
                <input type="file" id="file-upload" accept="application/pdf,image/*" hidden>
            </label>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace" id="workspace">
        
        <!-- Empty State -->
        <div class="empty-state active" id="empty-state">
            <div class="drop-zone" id="drop-zone">
                <div class="drop-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <h3>Drag & Drop Contract</h3>
                <p>Support PDF and Images</p>
                <button class="btn btn-secondary" onclick="document.getElementById('file-upload').click()">Browse Files</button>
            </div>
        </div>

        <!-- Analysis State (3-column layout) -->
        <div class="analysis-state" id="analysis-state">
            <!-- Left Sidebar: Document Structure & Status -->
            <aside class="sidebar-left glass-card">
                <div class="panel-section">
                    <h3>Document Vision</h3>
                    <div class="page-list" id="page-list">
                        <!-- Pages injected here -->
                    </div>
                </div>
                <div class="panel-section">
                    <h3>Parties</h3>
                    <div class="parties-list" id="parties-list">
                        <!-- Parties injected here -->
                    </div>
                </div>
                <div class="panel-section">
                    <h3>Execution Status</h3>
                    <div class="execution-status" id="execution-status">
                        <!-- Execution / VQA info injected here -->
                    </div>
                </div>
            </aside>

            <!-- Center: Canvas -->
            <section class="center-canvas glass-card">
                <div class="canvas-toolbar">
                    <div class="zoom-controls">
                        <button class="btn-icon" id="btn-zoom-out" title="Zoom Out">-</button>
                        <span id="zoom-level">100%</span>
                        <button class="btn-icon" id="btn-zoom-in" title="Zoom In">+</button>
                    </div>
                    <button class="btn-secondary btn-sm" id="btn-toggle-boxes">Toggle Overlays</button>
                </div>
                <div class="canvas-container" id="canvas-container">
                    <canvas id="doc-canvas"></canvas>
                    <div class="canvas-loading" id="canvas-loading" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>

            <!-- Right Sidebar: Risk & Intelligence -->
            <aside class="sidebar-right glass-card">
                <div class="risk-score-container">
                    <h3>Overall Risk</h3>
                    <div class="gauge-wrapper" id="risk-gauge-container">
                        <!-- SVG gauge injected here -->
                    </div>
                    <p class="risk-summary" id="risk-summary-text"></p>
                </div>
                
                <div class="panel-section">
                    <h3>Detected Clauses</h3>
                    <div class="clause-list" id="clause-list">
                        <!-- Clause cards injected here -->
                    </div>
                </div>
                
                <div class="panel-section">
                    <h3>Audit Trail</h3>
                    <div class="audit-trail" id="audit-trail">
                        <!-- Audit trail injected here -->
                    </div>
                </div>
            </aside>
        </div>

        <!-- Error State -->
        <div class="error-state" id="error-state">
            <div class="error-card glass-card">
                <div class="error-icon">⚠</div>
                <h3>Analysis Failed</h3>
                <p id="error-message">An unexpected error occurred.</p>
                <button class="btn btn-primary" id="btn-retry">Try Again</button>
            </div>
        </div>
    </main>

    <!-- Modal for Clause Detail -->
    <div class="modal-overlay" id="clause-modal">
        <div class="modal-card glass-card">
            <header class="modal-header">
                <h3 id="modal-clause-category">Clause Detail</h3>
                <button class="btn-icon close-modal" id="btn-close-modal">&times;</button>
            </header>
            <div class="modal-body" id="modal-clause-body">
                <!-- Detailed content injected here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/viewer.js"></script>
    <script src="js/report.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
