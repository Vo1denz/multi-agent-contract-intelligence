[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseiq"
version = "0.1.0"
description = "Multi-Agent, Multimodal Contract Risk Intelligence System"
readme = "README.md"
authors = [
    { name = "ClauseIQ Team", email = "team@clauseiq.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.13",
    "langgraph>=0.0.30",
    "langchain-openai>=0.1.1",
    "langchain-anthropic>=0.1.5",
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "peft>=0.9.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
    "evidently>=0.4.18",
    "ragas>=0.1.4",
    "langfuse>=2.21.0",
    "arize-phoenix>=3.20.0",
    "pillow>=10.2.0",
    "pdf2image>=1.17.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.4",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "ipykernel>=6.29.3",
    "jupyterlab>=4.1.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
